name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A stacked merge (`gh stack merge`) updates main without a push event, so CI
  # must be dispatchable by hand afterwards: gh workflow run ci.yml --ref main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install zsh (shell-portability tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Run tests
        run: npm test
